name: deploy

# Vercel's own Git integration is switched off in vercel.json. It used to open a
# deployment for every pull request, and because the preview environment carries
# real secrets (REGISTRY_TOKEN among them) Vercel rightly refused to build a fork
# without authorization — leaving a permanent red "Authorization required to
# deploy" on every contributor's PR. Turning fork protection off instead would
# have handed arbitrary PR code the token that writes domains/, so deployment
# moved here, where only main can trigger it.
on:
  push:
    branches: [main]
    # Registry data pushes — claims, record edits, the owners index, docs —
    # change nothing the site serves, but each one used to build and upload
    # the full app anyway. The day the registry got busy that burned through
    # Vercel's free-tier upload quota ("api-upload-paid … more than 40000"),
    # and every deploy after it failed while claims kept landing. Data
    # commits no longer deploy at all; workflow_dispatch remains the manual
    # path for forcing one.
    paths-ignore: ['domains/**', 'owners/**', 'data/**', 'docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token='${{ secrets.VERCEL_TOKEN }}'
      - run: npx vercel build --prod --token='${{ secrets.VERCEL_TOKEN }}'
      - run: npx vercel deploy --prebuilt --prod --token='${{ secrets.VERCEL_TOKEN }}'
